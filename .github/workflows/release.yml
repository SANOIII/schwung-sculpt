name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host tests
        run: bash scripts/test.sh

      - name: Verify version match
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(grep '"version"' src/module.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "Tag $TAG_VERSION != module.json $MODULE_VERSION"; exit 1
          fi

      - name: Cross-compile (aarch64)
        run: |
          docker build -t sculpt-builder -f scripts/Dockerfile .
          docker run --rm -v "$PWD:/build" -w /build sculpt-builder bash scripts/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sculpt-module
          path: dist/sculpt-module.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sculpt-module.tar.gz

      - name: Commit release.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json <<JSON
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sculpt-module.tar.gz"
          }
          JSON
          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes"
          git push origin main
